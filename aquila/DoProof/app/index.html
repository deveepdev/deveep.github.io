<meta name="theme-color" content="#202631">
<link rel="manifest" href="./manifest.json?v=2.2">
<title>Dough Proof</title>

<script>
    (function() {
        const schemes = {
            classic: {
                '--background': '#0f172a',
                '--primary': '#1e293b',
                '--secondary': '#334155',
                '--accent': '#3d7d54',
                '--border': 'rgba(255, 255, 255, 0.08)',
                '--red': '#f94f16',
                '--text': '#e2e8f0'
            },
            dark: {
                '--background': '#0a0a0a',
                '--primary': '#171717',
                '--secondary': '#262626',
                '--accent': '#41235e',
                '--border': 'rgba(255, 255, 255, 0.06)',
                '--red': '#ef4444',
                '--text': '#f5f5f5'
            },
            light: {
                '--background': '#fcfff8',
                '--primary': '#a9d178',
                '--secondary': '#bdd1a4',
                '--accent': '#92CC49',
                '--border': 'rgba(0, 0, 0, 0.08)',
                '--red': '#fb7185',
                '--text': '#0f172a'
            },
            civic: {
                '--background': '#050607',
                '--primary': '#1a1d20',
                '--secondary': '#2c3136',
                '--accent': '#6b7280',
                '--border': 'rgba(255, 255, 255, 0.06)',
                '--red': '#ff3b3b',
                '--text': '#f1f5f9'
            }
        };

        const savedTheme = localStorage.getItem('selected-theme');
        const theme = schemes[savedTheme] ? savedTheme : 'classic';
        const root = document.documentElement;

        Object.entries(schemes[theme]).forEach(([prop, value]) => {
            root.style.setProperty(prop, value);
        });

        if (theme === 'civic') {
            document.addEventListener('DOMContentLoaded', () => {
                document.body.classList.add('civic-active');
            });
        }
    })();
</script>

<style>
    .loading-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #05070f;
        color: #f5f5f5;
        z-index: 9999;
    }
    .loading-screen {
        text-align: center;
        padding: 24px 28px;
        border-radius: 18px;
        background: rgba(5, 8, 15, 0.96);
        border: 1px solid rgba(255, 255, 255, 0.08);
        max-width: 280px;
        width: 100%;
    }
    .loading-spinner {
        width: 40px;
        height: 40px;
        margin: 0 auto 16px;
        border: 4px solid rgba(255, 255, 255, 0.14);
        border-top-color: #92CC49;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
        to { transform: rotate(360deg); }
    }
</style>
</head>

<body>

</div>

</div>
<div class="container">


<div class="top-bar">

    <button id="clearBtn">Clear</button>

<form id="form">
<div id="inputs"></div>
</form>

<div class="auth-modal-backdrop" id="authModalBackdrop" aria-hidden="true">
    <div class="auth-modal" role="dialog" aria-modal="true" aria-labelledby="authModalTitle">
        <button class="auth-close-btn" id="closeAuthModal" aria-label="Close authentication modal">×</button>
        <div class="auth-modal-content">
            <h2 id="authModalTitle">Secure login and signup</h2>
            <p class="auth-description">Access your DoProof workspace with your email and password.</p>
            <div class="auth-fields">
                <label class="auth-label">Email
                    <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
                </label>
                <label class="auth-label auth-password-label">Password
                    <div class="auth-password-row">
                        <input type="password" id="password" placeholder="Password" autocomplete="current-password">
                        <button type="button" class="password-toggle" id="togglePassword" aria-label="Show password">Show</button>
                    </div>
                </label>
            </div>
            <div class="auth-actions">
                <button id="signup">Create account</button>
                <button id="login">Log In</button>
            </div>
            <p id="status" class="auth-status">Not logged in</p>
        </div>
    </div>
